<div class="flex h-screen bg-brand-dark overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 glass-panel border-r border-white/5 hidden md:flex flex-col z-20 relative">
        <div class="p-8">
            <h2
                class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-primary to-brand-accent">
                NeoBank
            </h2>
        </div>

        <nav class="flex-1 px-4 space-y-2">
            <a routerLink="/dashboard/overview" routerLinkActive="bg-brand-primary/10 text-brand-primary"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all">
                <i class="ph ph-squares-four text-xl"></i>
                <span>Overview</span>
            </a>
            <a href="#"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all">
                <i class="ph ph-credit-card text-xl"></i>
                <span>My Cards</span>
            </a>
            <a href="#"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all">
                <i class="ph ph-arrows-left-right text-xl"></i>
                <span>Transactions</span>
            </a>
            <a href="#"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all">
                <i class="ph ph-gift text-xl"></i>
                <span>Rewards</span>
            </a>
        </nav>

        <div class="p-4 border-t border-white/5">
            <button (click)="logout()"
                class="flex items-center gap-3 px-4 py-3 w-full rounded-xl text-red-400 hover:bg-red-500/10 transition-all">
                <i class="ph ph-sign-out text-xl"></i>
                <span>Sign Out</span>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col relative overflow-hidden">
        <!-- Header -->
        <header
            class="h-16 border-b border-white/5 flex items-center justify-between px-8 bg-brand-dark/50 backdrop-blur-sm z-10">
            <div class="flex items-center gap-4 text-slate-400">
                <button class="md:hidden text-2xl text-white">
                    <i class="ph ph-list"></i>
                </button>
                <span class="text-sm">Welcome back, {{ username }}</span>
            </div>

            <div class="flex items-center gap-4">
                <button
                    class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-slate-300 hover:bg-white/10 transition-colors relative">
                    <i class="ph ph-bell text-xl"></i>
                    <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-brand-danger"></span>
                </button>
                <div
                    class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-primary to-brand-accent flex items-center justify-center text-white font-bold">
                    {{ username.charAt(0).toUpperCase() }}
                </div>
            </div>
        </header>

        <!-- Scrollable Content -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 relative">
            <!-- Background Blobs for Dashboard -->
            <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
                <div
                    class="absolute top-[10%] left-[20%] w-[400px] h-[400px] rounded-full bg-brand-primary/5 blur-[100px]">
                </div>
                <div
                    class="absolute bottom-[20%] right-[10%] w-[300px] h-[300px] rounded-full bg-brand-success/5 blur-[80px]">
                </div>
            </div>

            <div class="relative z-10">
                <router-outlet></router-outlet>
            </div>
        </main>
    </div>
</div>
