<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

    <!-- Left Column: Cards & Actions (2 cols wide on large screens) -->
    <div class="lg:col-span-2 space-y-8">

        <!-- Hero Section / Cards -->
        <section>
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-white">My Cards</h2>
                <button class="text-brand-primary text-sm hover:text-white transition-colors">+ Add New Card</button>
            </div>

            <!-- The Credit Card (Glassmorphism + Gradients) -->
            <div
                class="w-full max-w-sm aspect-[1.586/1] rounded-2xl relative overflow-hidden shadow-2xl transition-transform hover:scale-[1.02] duration-300">
                <!-- Card Background -->
                <div class="absolute inset-0 bg-gradient-to-br from-brand-accent to-purple-600"></div>
                <div class="absolute inset-0 bg-white/10 backdrop-blur-[2px]"></div>

                <!-- Decorative Circles -->
                <div class="absolute top-[-50%] right-[-50%] w-[100%] h-[100%] rounded-full bg-white/20 blur-xl"></div>
                <div
                    class="absolute bottom-[-20%] left-[-20%] w-[60%] h-[60%] rounded-full bg-brand-primary/40 blur-xl">
                </div>

                <!-- content -->
                <div class="absolute inset-0 p-6 flex flex-col justify-between text-white z-10">
                    <div class="flex justify-between items-start">
                        <div class="text-xs font-mono opacity-80">DEBIT CARD</div>
                        <i class="ph ph-wifi-high text-2xl opacity-80"></i>
                    </div>

                    <div class="flex items-center gap-4 my-2">
                        <div class="w-12 h-8 bg-white/20 rounded flex items-center justify-center backdrop-blur-md">
                            <div class="w-8 h-4 rounded-sm border border-white/30 bg-yellow-500/20"></div>
                        </div>
                        <i class="ph ph-contactless-payment text-2xl"></i>
                    </div>

                    <div>
                        <div class="font-mono text-xl tracking-widest mb-4 drop-shadow-md">
                            **** **** **** 4289
                        </div>
                        <div class="flex justify-between items-end">
                            <div>
                                <div class="text-[10px] opacity-70 uppercase tracking-wider">Card Holder</div>
                                <div class="font-medium tracking-wide">ALEX JOHNSON</div>
                            </div>
                            <div>
                                <div class="text-[10px] opacity-70 uppercase tracking-wider">Expires</div>
                                <div class="font-medium tracking-wide">12/26</div>
                            </div>
                            <div class="text-2xl font-bold italic opacity-90">VISA</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Quick Actions -->
        <section>
            <h3 class="text-lg font-bold text-white mb-4">Quick Actions</h3>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <button
                    class="glass-card p-4 flex flex-col items-center justify-center gap-3 hover:bg-white/10 transition-all group">
                    <div
                        class="w-12 h-12 rounded-full bg-brand-primary/20 flex items-center justify-center text-brand-primary group-hover:scale-110 transition-transform">
                        <i class="ph ph-paper-plane-tilt text-2xl"></i>
                    </div>
                    <span class="text-sm text-slate-300">Send</span>
                </button>
                <button
                    class="glass-card p-4 flex flex-col items-center justify-center gap-3 hover:bg-white/10 transition-all group">
                    <div
                        class="w-12 h-12 rounded-full bg-brand-success/20 flex items-center justify-center text-brand-success group-hover:scale-110 transition-transform">
                        <i class="ph ph-download-simple text-2xl"></i>
                    </div>
                    <span class="text-sm text-slate-300">Receive</span>
                </button>
                <button
                    class="glass-card p-4 flex flex-col items-center justify-center gap-3 hover:bg-white/10 transition-all group">
                    <div
                        class="w-12 h-12 rounded-full bg-brand-warning/20 flex items-center justify-center text-brand-warning group-hover:scale-110 transition-transform">
                        <i class="ph ph-credit-card text-2xl"></i>
                    </div>
                    <span class="text-sm text-slate-300">Top Up</span>
                </button>
                <button
                    class="glass-card p-4 flex flex-col items-center justify-center gap-3 hover:bg-white/10 transition-all group">
                    <div
                        class="w-12 h-12 rounded-full bg-purple-500/20 flex items-center justify-center text-purple-400 group-hover:scale-110 transition-transform">
                        <i class="ph ph-dots-three text-2xl"></i>
                    </div>
                    <span class="text-sm text-slate-300">More</span>
                </button>
            </div>
        </section>

    </div>

    <!-- Right Column: Transactions -->
    <div class="glass-panel rounded-2xl p-6 h-full min-h-[500px] flex flex-col">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold text-white">Transactions</h2>
            <a href="#" class="text-sm text-brand-primary hover:underline">View All</a>
        </div>

        <div class="flex-1 overflow-y-auto space-y-4 pr-2">
            <!-- Loading State -->
            <div *ngIf="isLoading" class="space-y-4">
                <div *ngFor="let i of [1,2,3,4,5]" class="animate-pulse flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-slate-700"></div>
                    <div class="flex-1">
                        <div class="h-4 bg-slate-700 rounded w-1/3 mb-2"></div>
                        <div class="h-3 bg-slate-700/50 rounded w-1/4"></div>
                    </div>
                    <div class="h-4 bg-slate-700 rounded w-16"></div>
                </div>
            </div>

            <!-- Empty State -->
            <div *ngIf="!isLoading && transactions.length === 0"
                class="flex flex-col items-center justify-center h-full text-slate-500">
                <i class="ph ph-receipt text-4xl mb-3"></i>
                <p>No recent transactions</p>
            </div>

            <!-- Transaction List -->
            <div *ngFor="let t of transactions"
                class="flex items-center justify-between p-3 rounded-xl hover:bg-white/5 transition-colors group">
                <div class="flex items-center gap-4">
                    <div
                        class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-xl overflow-hidden relative">
                        <!-- Icon based on category mock -->
                        <i class="ph ph-shopping-bag text-slate-400 group-hover:text-white transition-colors"></i>
                    </div>
                    <div>
                        <h4 class="text-white font-medium text-sm">{{ t.description || t.merchant }}</h4>
                        <p class="text-slate-400 text-xs">{{ t.date | date:'shortDate' }} • {{ t.category }}</p>
                    </div>
                </div>

                <!-- Amount: Red for debit, Green for input (simple logic for now) -->
                <div class="text-right">
                    <span class="block font-semibold text-sm" [ngClass]="{'text-white': true}">
                        -${{ t.amount | number:'1.2-2' }}
                    </span>
                    <span class="text-[10px] text-slate-500 decoration-slate-500/50 line-through"
                        *ngIf="t.status === 'PENDING'">Pending</span>
                </div>
            </div>
        </div>
    </div>

</div>
